name: Prepare pinned Cua source
description: Verify native patches, select the pinned Rust compiler and restore check-only Cargo outputs

runs:
  using: composite
  steps:
    - name: Verify and prepare native source
      id: source
      shell: bash
      run: |
        set -euo pipefail
        release=packages/shared/src/computer/cuaDriverRelease.json
        source_commit=$(jq -r .source "$release")
        rust_version=$(jq -r .rustVersion "$release")
        native_source="$RUNNER_TEMP/cua-native-source"
        hash_command=(shasum -a 256)
        patches=(0001-glade-native.patch)
        fields=(patchSha256)
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          hash_command=(sha256sum)
          patches+=(0002-glade-linux-browser.patch)
          fields+=(linuxBrowserPatchSha256)
        fi
        for i in "${!patches[@]}"; do
          patch_file="$GITHUB_WORKSPACE/apps/desktop/patches/cua-driver/${patches[$i]}"
          actual=$("${hash_command[@]}" "$patch_file" | cut -d ' ' -f 1)
          test "$actual" = "$(jq -r ".${fields[$i]}" "$release")"
        done
        rustup toolchain install "$rust_version" --profile minimal
        echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
        git init "$native_source"
        git -C "$native_source" remote add origin https://github.com/trycua/cua.git
        git -C "$native_source" sparse-checkout set libs/cua-driver
        git -C "$native_source" fetch --filter=blob:none --depth=1 origin "$source_commit"
        git -C "$native_source" checkout --detach FETCH_HEAD
        test "$(git -C "$native_source" rev-parse HEAD)" = "$source_commit"
        for patch in "${patches[@]}"; do
          patch_file="$GITHUB_WORKSPACE/apps/desktop/patches/cua-driver/$patch"
          git -C "$native_source" apply --check "$patch_file"
          git -C "$native_source" apply "$patch_file"
        done
        echo "CUA_NATIVE_SOURCE=$native_source" >> "$GITHUB_ENV"
        echo "image=${ImageOS:?Runner image OS is missing}-${ImageVersion:?Runner image version is missing}" >> "$GITHUB_OUTPUT"

    # This cache accelerates checks only. Release binaries still require exact
    # compiler/SDK fingerprints and verified provenance via provision-cua.
    - name: Restore native check dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: ${{ runner.temp }}/cua-native-source/libs/cua-driver/rust -> target
        shared-key: cua-check-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.image }}-${{ hashFiles('packages/shared/src/computer/cuaDriverRelease.json', 'apps/desktop/patches/cua-driver/**', '.github/actions/prepare-cua-source/action.yml') }}
        env-vars: DEVELOPER_DIR
        cache-bin: "false"
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
