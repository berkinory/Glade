name: Setup workspace
description: Reproducible dependency setup sized to each CI lane

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"
  scope:
    description: "Install scope: full or static (root and scripts)."
    default: "full"
  save-dependencies:
    description: Save dependency caches from designated main CI producers only.
    default: "false"
  save-electron-cache:
    description: Save the Electron cache from the main CI build job only.
    default: "false"
  turbo:
    description: Restore Turbo build artifacts for jobs that build with Turbo.
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate install scope
      shell: bash
      env:
        WORKSPACE_SCOPE: ${{ inputs.scope }}
        ELECTRON: ${{ inputs.electron }}
      run: |
        case "$WORKSPACE_SCOPE" in
          full|static) ;;
          *) echo "::error::Unknown workspace scope: $WORKSPACE_SCOPE"; exit 1 ;;
        esac
        if [ "$ELECTRON" = "true" ] && [ "$WORKSPACE_SCOPE" = "static" ]; then
          echo "::error::Electron requires a full install."
          exit 1
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: ./.github/actions/setup-node

    # Cache writers are elected by CI. Release and matrix consumers must not
    # upload the same large dependency tree after every job.
    - name: Restore dependencies
      id: modules
      if: ${{ runner.os != 'Windows' && inputs.scope == 'full' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-modules-v3-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'scripts/package.json', '.mise.toml', 'patches/**', '.github/actions/setup-workspace/action.yml') }}

    - name: Restore Turbo outputs
      id: turbo
      if: ${{ inputs.turbo == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .turbo
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ hashFiles('bun.lock', '.mise.toml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ hashFiles('bun.lock', '.mise.toml') }}-

    - name: Restore Electron runtime
      id: electron
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        WORKSPACE_SCOPE: ${{ inputs.scope }}
      run: |
        # Hosted Windows checks out on D:, while Bun's default home cache is on C:.
        # Match the measured setup so package hardlinks can stay on one volume.
        if [ "$RUNNER_OS" = "Windows" ]; then
          export BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-install-cache"
          echo "Bun install cache: $BUN_INSTALL_CACHE_DIR"
        fi
        for attempt in 1 2; do
          case "$WORKSPACE_SCOPE" in
            full) args=(--frozen-lockfile) ;;
            static) args=(--frozen-lockfile --filter './' --filter '@glade/scripts') ;;
          esac
          if bun install "${args[@]}"; then
            break
          fi
          if [ "$attempt" -eq 2 ]; then
            echo "::error::Bun install failed twice."
            exit 1
          fi
          echo "::warning::Bun install failed; retrying after dependency extraction settles."
          sleep 5
        done

    # Save before downloading Electron or building. Native modules stay scoped
    # to their OS/architecture; Electron binaries and build outputs stay separate.
    - name: Save dependencies
      if: ${{ inputs.save-dependencies == 'true' && runner.os != 'Windows' && inputs.scope == 'full' && steps.modules.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done

    - name: Save Electron runtime
      if: ${{ inputs.save-electron-cache == 'true' && inputs.electron == 'true' && steps.electron.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/electron
        key: ${{ steps.electron.outputs.cache-primary-key }}

    - name: Cache setup summary
      shell: bash
      env:
        MODULES_HIT: ${{ steps.modules.outputs.cache-hit }}
        TURBO_HIT: ${{ steps.turbo.outputs.cache-hit }}
        ELECTRON_HIT: ${{ steps.electron.outputs.cache-hit }}
        WORKSPACE_SCOPE: ${{ inputs.scope }}
      run: |
        {
          echo "### Workspace setup ($RUNNER_OS / $RUNNER_ARCH, $WORKSPACE_SCOPE)"
          echo "| Cache | Exact hit |"
          echo "| --- | --- |"
          echo "| Dependencies | ${MODULES_HIT:-not restored} |"
          echo "| Turbo | ${TURBO_HIT:-not restored} |"
          echo "| Electron | ${ELECTRON_HIT:-not restored} |"
        } >> "$GITHUB_STEP_SUMMARY"
