name: Bug report
description: Report a problem in Glade.
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Search existing issues first.
        For a security vulnerability, use [private vulnerability reporting](https://github.com/berkinory/Glade/security/advisories/new) instead of this public form.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce or context
      description: If it happens intermittently, describe what you were doing and how often it occurs.
      placeholder: |
        1. Open Glade...
        2. Do...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glade version or commit
      description: Use "unknown" if unavailable.
      placeholder: "Commit SHA or version shown in the app"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "macOS 15, Apple Silicon"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Agent runtime, if relevant
      placeholder: "Codex or Claude Code"
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional. Drag files here if useful. Remove secrets and personal data.
