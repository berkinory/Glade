name: Release Glade

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish from the matching version tag"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glade-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
  GLADE_DESKTOP_UPDATE_REPOSITORY: berkinory/Glade

jobs:
  checks:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          node scripts/verify-release-source-provenance.ts "$version" "v$version" "$PUBLISH_RELEASE" "$GITHUB_SHA" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"
      - name: Require green main CI for this exact commit
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ((attempt=0; attempt<180; attempt++)); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=20" \
              --jq '.workflow_runs | sort_by(.run_attempt) | reverse | .[0] | [.status, .conclusion] | @tsv')"
            case "$run" in
              $'completed\tsuccess') echo "Exact-commit main CI passed."; exit 0 ;;
              $'completed\t'*) echo "::error::Exact-commit main CI failed: $run"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::No successful main CI run for release commit $GITHUB_SHA."
          exit 1
      - uses: ./.github/actions/setup-workspace
        if: env.PUBLISH_RELEASE != 'true'
        with:
          electron: "true"
      - name: Run checks for unpublished manual builds
        if: env.PUBLISH_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run check
          bun run test
          node scripts/check-windows-runtime-boundary.ts
          node scripts/check-migration-lineage.ts

  build:
    name: Build ${{ matrix.id }}
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
          - id: mac-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
          - id: win-x64
            runner: windows-2022
            platform: win
            arch: x64
            target: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"
      - name: Verify exact source before building
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          node scripts/verify-release-source-provenance.ts "$version" "v$version" "$PUBLISH_RELEASE" "$GITHUB_SHA" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"
      - name: Verify macOS publication credentials
        if: matrix.platform == 'mac' && env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing macOS release secret: $key"; exit 1; fi
          done
      - uses: ./.github/actions/provision-cua
        if: matrix.platform != 'win'
        with:
          arch: ${{ matrix.arch }}
      - name: Build platform artifact
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          CSC_NAME: Pixen Interactive LLC (8M2GQK3TUP)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GLADE_MAC_ICON_CATALOG: ${{ github.workspace }}/assets/prod/Glade-Assets.car
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ steps.source.outputs.lockfile_sha256 }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          args=(--output-dir release --verbose --build-version "$RELEASE_VERSION" --source-commit "$GITHUB_SHA" --lockfile-sha256 "$LOCKFILE_SHA256")
          if [[ -n "$SOURCE_TAG" ]]; then args+=(--source-tag "$SOURCE_TAG"); fi
          case "$BUILD_PLATFORM" in
            mac)
              if [[ "$PUBLISH_RELEASE" == "true" ]]; then
                key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                printf '%s' "$APPLE_API_KEY" > "$key_path"
                chmod 600 "$key_path"
                export APPLE_API_KEY="$key_path" CSC_IDENTITY_AUTO_DISCOVERY=true
                args+=(--signed)
              fi
              bun run "package:mac:$BUILD_ARCH" -- "${args[@]}"
              ;;
            linux) bun run package:linux -- "${args[@]}" ;;
            win) bun run package:win -- "${args[@]}" ;;
            *) exit 1 ;;
          esac
      - name: Verify packaged startup
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: node scripts/verify-packaged-desktop-startup.ts --assets-dir release --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" --version "$RELEASE_VERSION" --executable-name glade
      - name: Collect and verify distribution assets
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ steps.source.outputs.lockfile_sha256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          case "$BUILD_PLATFORM" in
            mac)
              cp release/*.dmg release/*.zip release-publish/
              if [[ "$BUILD_ARCH" == x64 ]]; then
                cp release/latest-mac-x64.yml release-publish/latest-mac-x64.yml
              else
                cp release/latest-mac.yml release-publish/latest-mac-arm64.yml
              fi
              ;;
            linux) cp release/*.AppImage release/latest-linux.yml release-publish/ ;;
            win) cp release/*.exe release/latest.yml release-publish/ ;;
            *) exit 1 ;;
          esac
          find release -maxdepth 1 -name '*.blockmap' -exec cp {} release-publish/ \;
          signed=false
          if [[ "$BUILD_PLATFORM" == mac && "$PUBLISH_RELEASE" == true ]]; then signed=true; fi
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release-publish --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" \
            --target "$BUILD_TARGET" --version "$RELEASE_VERSION" \
            --source-commit "$GITHUB_SHA" --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" --publication "$PUBLISH_RELEASE" \
            --signed "$signed" --allow-unsigned-windows-publication true \
            --expected-mac-team-id "$APPLE_TEAM_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Glade-${{ matrix.id }}
          path: release-publish/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Assemble release
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          pattern: Glade-*
          merge-multiple: true
          path: release-raw
      - name: Verify and assemble all platforms
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          node scripts/assemble-release-assets.ts release-raw release-publish "$version" "$GITHUB_SHA" "$PUBLISH_RELEASE"
          ls -lh release-publish
      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-publish/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Glade $GITHUB_REF_NAME" --notes-file release-notes.md --latest

  sync-homebrew:
    name: Update Homebrew cask
    needs: publish
    if: github.event_name == 'push' || inputs.publish_release
    uses: ./.github/workflows/sync-homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
