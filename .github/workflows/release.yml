name: Release Glade

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish from the matching version tag"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glade-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
  GLADE_DESKTOP_UPDATE_REPOSITORY: berkinory/Glade

jobs:
  checks:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          node scripts/verify-release-source-provenance.ts "$version" "v$version" "$PUBLISH_RELEASE" "$GITHUB_SHA" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"
      - name: Verify macOS publication credentials
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing macOS release secret: $key"; exit 1; fi
          done
      - name: Require green main CI for this exact commit
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=""
          for ((attempt=0; attempt<180; attempt++)); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at, .id) | reverse | .[0] | [.status, .conclusion] | @tsv')"
            if [[ "$run" != "$previous" ]]; then
              echo "Exact-commit main CI: ${run:-not found yet}"
              previous="$run"
            fi
            case "$run" in
              $'completed\tsuccess') echo "Exact-commit main CI passed."; exit 0 ;;
              $'completed\t'*) echo "::error::Exact-commit main CI failed: $run"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::No successful main CI run for release commit $GITHUB_SHA."
          exit 1
      - uses: ./.github/actions/setup-workspace
        if: env.PUBLISH_RELEASE != 'true'
      - name: Run checks for unpublished manual builds
        if: env.PUBLISH_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run check
          bun run test
          node scripts/check-windows-runtime-boundary.ts
          node scripts/check-migration-lineage.ts

  build:
    name: Build ${{ matrix.id }}
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: mac-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
          - id: mac-x64
            runner: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
          - id: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
          - id: win-x64
            runner: windows-2022
            platform: win
            arch: x64
            target: nsis
    uses: ./.github/workflows/release-build.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
      publish: ${{ github.event_name == 'push' || inputs.publish_release == true }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    permissions:
      contents: read
      actions: read

  publish:
    name: Assemble release
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Glade-*
          merge-multiple: true
          path: release-raw
      - name: Verify and assemble all platforms
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          node scripts/assemble-release-assets.ts release-raw release-publish "$version" "$GITHUB_SHA" "$PUBLISH_RELEASE"
          ls -lh release-publish
      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-publish/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Glade $GITHUB_REF_NAME" --notes-file release-notes.md --latest

  sync-homebrew:
    name: Update Homebrew cask
    needs: publish
    if: github.event_name == 'push' || inputs.publish_release
    uses: ./.github/workflows/sync-homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
