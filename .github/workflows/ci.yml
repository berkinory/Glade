# Independent feedback lanes; the quality job only aggregates results.
# Desktop launch coverage remains in the build lane.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Stale runs cancelled by a newer push show the gate red, not grey. The default branch never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single heap ceiling for every Node lane (typecheck OOM fix): set once here
# instead of per job so a future bump cannot miss a lane.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Docs-only filter: PRs touching only prose or doc images
  # run static-fast + gate only. outputs.code is 'true' when any code file changed.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    # dorny/paths-filter lists PR files via the API: it needs pull-requests
    # scope on top of the checkout's contents scope (repo default is tighter).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter docs-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Default quantifier is 'some': any matching pattern includes the file,
          # so '!**/*.md' style exclusions never exclude anything and every PR
          # classifies as code. 'every' requires all patterns to match, which is
          # what makes the include-all + exclude-docs combination work.
          predicate-quantifier: "every"
          filters: |
            code:
              # Directory exclusions stay scoped to code-free trees: web ships a .ts module
              # under assets/, so '**/docs/**' / '**/assets/**' would let real
              # code skip the gate. Images under .github/ are code-free. Runtime images stay on
              # the code path because they ship in the application.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/*.mdx'
              - '!.github/**/*.{png,jpg,jpeg,gif,svg,webp,ico}'

  # Root + scripts dependencies suffice for every static check and release smoke.
  # Never wait for the changes job to report formatting or lint failures.
  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: "static"

      - name: Verify Windows runtime boundary
        run: bun scripts/check-windows-runtime-boundary.ts

      - name: Format
        run: bunx oxfmt --check

      - name: Lint
        run: bunx oxlint --report-unused-disable-directives --deny-warnings

  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Module boundaries and unused code
        run: bun run check:architecture

      - name: Type-aware promise and runtime checks
        run: bun run check:typed-lint

      - name: Typecheck
        run: |
          bunx effect-tsgo patch --typescript --typescript-package @typescript/native
          bunx turbo run typecheck

  # Keep each server shard serial internally, but use three independent runners.
  # The measured native 3-way split lowers the slowest shard without changing
  # collected tests. Tests import @glade/contracts from source (its ESM export),
  # so no package build precedes them; every lane starts at the test files.
  unit:
    name: Unit Tests (${{ matrix.pkg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        include:
          - pkg: core
            filters: "--filter=@glade/contracts --filter=@glade/shared --filter=@glade/scripts --filter=@glade/desktop"
            test-args: ""
          - pkg: web
            filters: "--filter=@glade/web"
            test-args: ""
          # Server lane tests the CLI package (package name @glade/cli).
          - pkg: server 1/3
            filters: "--filter=@glade/cli"
            test-args: "--shard=1/3"
          - pkg: server 2/3
            filters: "--filter=@glade/cli"
            test-args: "--shard=2/3"
          - pkg: server 3/3
            filters: "--filter=@glade/cli"
            test-args: "--shard=3/3"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Linux terminal PTY native dependency
        if: matrix.filters == '--filter=@glade/cli' && matrix.test-args == '--shard=1/3'
        run: node scripts/node-pty-smoke.mjs

      - name: Test (${{ matrix.pkg }})
        run: bunx turbo run test ${{ matrix.filters }} -- ${{ matrix.test-args }}

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Configure Electron sandbox helper
        run: |
          sandbox_helper="$(node -p "require('node:path').join(require('node:path').dirname(require('./apps/desktop/node_modules/electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"

      - name: Verify live Electron browser lifecycle
        run: xvfb-run -a bun run --cwd apps/desktop smoke:browser-lifecycle

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  # Aggregate only: no checkout, install, build or test execution.
  # Preserve the branch-protection display name and always() failure handling.
  # Needs every required lane. Matrix jobs report one result covering
  # all shards, so ANY failed shard fails the gate. Docs-only runs pass with
  # heavy lanes skipped (static-fast must still succeed).
  quality:
    # Preserve the existing required-check name until branch protection is updated.
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - static-fast
      - static-typecheck
      - unit
      - build
      - windows_process
      - migration_lineage
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          STATIC_FAST: ${{ needs.static-fast.result }}
          TYPECHECK: ${{ needs.static-typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS_PROCESS: ${{ needs.windows_process.result }}
          MIGRATION_LINEAGE: ${{ needs.migration_lineage.result }}
        run: |
          fail=0
          # The docs-only filter itself must have run: without it a skip proves nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "changes=$CHANGES (filter must succeed)"
            fail=1
          fi
          if [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "code=$CODE (filter must return true or false)"
            fail=1
          fi
          # Fast static always runs, docs-only or not.
          if [ "$STATIC_FAST" != "success" ]; then
            echo "static-fast=$STATIC_FAST"
            fail=1
          fi
          for lane in "typecheck=$TYPECHECK" "unit=$UNIT" "build=$BUILD" "windows-process=$WINDOWS_PROCESS" "migration-lineage=$MIGRATION_LINEAGE"; do
            name="${lane%%=*}"
            result="${lane#*=}"
            if [ "$CODE" != "true" ]; then
              # Docs-only run: heavy lanes must be skipped, never failed.
              if [ "$result" != "skipped" ]; then
                echo "$name=$result (docs-only run: expected skipped)"
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              echo "$name=$result"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Open the red lane above, not this gate."
            exit 1
          fi

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: "full"

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      - name: Test Windows shared runtime and migration recovery
        run: >-
          bun run --cwd packages/shared test
          src/windowsProcess.test.ts
          src/platformProcess.test.ts
          src/processRuntime.test.ts
          src/filesystemPlatform.test.ts
          src/platformEnvironment.test.ts
          src/migrationRecovery.test.ts

      - name: Test Windows server lifecycle and migration recovery
        run: >-
          bun run --cwd apps/server test
          src/platform/processTreeController.test.ts
          src/platform/effectProcessSignals.test.ts
          src/provider/supervisedProcessTeardown.test.ts
          src/provider/providerStartupLifecycle.test.ts
          src/processRunner.test.ts
          src/windowsProcessEffect.test.ts
          src/persistence/MigrationBackup.test.ts
          src/persistence/Migrations/MigrationReplay.test.ts

      # The 0.6.0 wedge hit Windows hardest, and the repair path is built out of
      # exactly what Windows treats differently: unlinking a marker, reclaiming
      # stranded partials, and renaming a database file that may still be held
      # open. Linux-only coverage cannot speak for any of that.
      - name: Test Windows desktop shutdown and migration recovery
        run: >-
          bun run --cwd apps/desktop test
          src/backendShutdown.windows.integration.test.ts
          src/desktopMigrationRecovery.test.ts

  # Released (id, name) migration pairs are recorded in every user's
  # effect_sql_migrations table, so renumbering or renaming one corrupts existing
  # installs. This job needs the release tags, hence the unshallow checkout; the
  # dependency-free guard needs a real tag history, never a missing-history skip.
  migration_lineage:
    name: Migration Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify released migration lineage
        run: |
          test -n "$(git tag --list 'v[0-9]*')" || { echo "::error::Release tags are missing; lineage cannot be verified."; exit 1; }
          bun scripts/check-migration-lineage.ts
