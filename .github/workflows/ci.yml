name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Stale runs cancelled by a newer push show the gate red, not grey. The default branch never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single heap ceiling for every Node lane (typecheck OOM fix): set once here
# instead of per job so a future bump cannot miss a lane.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      windows: ${{ steps.windows.outputs.windows }}
    # dorny/paths-filter lists PR files via the API: it needs pull-requests
    # scope on top of the checkout's contents scope (repo default is tighter).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter docs-only changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/*.mdx'
              - '!.github/**/*.{png,jpg,jpeg,gif,svg,webp,ico}'

      - name: Filter Windows runtime inputs
        id: windows
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            windows:
              - 'apps/server/**'
              - 'apps/desktop/**'
              - 'packages/**'
              - 'scripts/**'
              - 'patches/**'
              - 'package.json'
              - 'bun.lock'
              - '.mise.toml'
              - '*config*'
              - '.github/actions/setup-workspace/**'
              - '.github/actions/setup-node/**'
              - '.github/workflows/ci.yml'

  # Root + scripts dependencies suffice for the fast checks.
  # Never wait for the changes job to report formatting or lint failures.
  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup workspace
        id: setup
        uses: ./.github/actions/setup-workspace
        with:
          scope: "static"

      - name: Install actionlint
        id: actionlint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Lint GitHub Actions workflows
        if: ${{ !cancelled() && steps.actionlint.outcome == 'success' }}
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Verify Windows runtime boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun scripts/check-windows-runtime-boundary.ts

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bunx oxfmt --check

      - name: Verify released migration lineage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          test -n "$(git tag --list 'v[0-9]*')" || { echo "::error::Release tags are missing; lineage cannot be verified."; exit 1; }
          bun scripts/check-migration-lineage.ts

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bunx oxlint --report-unused-disable-directives --deny-warnings

  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        id: setup
        uses: ./.github/actions/setup-workspace
        with:
          save-dependencies: "true"

      - name: Module boundaries and unused code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check:architecture

      - name: Type-aware promise and runtime checks
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run check:typed-lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bunx effect-tsgo patch --typescript --typescript-package @typescript/native
          bunx turbo run typecheck

  # Keep long server shards parallel; core and web fit on one runner.
  unit:
    name: Unit Tests (${{ matrix.pkg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        include:
          - pkg: core + web
            filters: "--filter=@glade/contracts --filter=@glade/shared --filter=@glade/scripts --filter=@glade/desktop"
            test-args: ""
          # Server lane tests the CLI package (package name @glade/cli).
          - pkg: server 1/3
            filters: "--filter=@glade/cli"
            test-args: "--shard=1/3"
          - pkg: server 2/3
            filters: "--filter=@glade/cli"
            test-args: "--shard=2/3"
          - pkg: server 3/3
            filters: "--filter=@glade/cli"
            test-args: "--shard=3/3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        id: setup
        uses: ./.github/actions/setup-workspace

      - name: Verify Linux terminal PTY native dependency
        if: matrix.filters == '--filter=@glade/cli' && matrix.test-args == '--shard=1/3'
        run: node scripts/node-pty-smoke.mjs

      - name: Test (${{ matrix.pkg }})
        run: bunx turbo run test --continue=always ${{ matrix.filters }} -- ${{ matrix.test-args }}

      - name: Test web
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.pkg == 'core + web' }}
        run: bunx turbo run test --filter=@glade/web

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"
          save-electron-cache: "true"

      # Turbo can replay the desktop build without running its fetch, so verify the pin explicitly.
      - name: Verify pinned Cua Driver release
        run: node apps/desktop/scripts/fetch-cua-driver.mjs --platform linux --arch x64

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

      - name: Save Turbo outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-v3-${{ hashFiles('bun.lock', '.mise.toml') }}-${{ github.sha }}

  quality:
    # Preserve the existing required-check name until branch protection is updated.
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - static-fast
      - static-typecheck
      - unit
      - build
      - windows_process
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
          STATIC_FAST: ${{ needs.static-fast.result }}
          TYPECHECK: ${{ needs.static-typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS_PROCESS: ${{ needs.windows_process.result }}
        run: |
          fail=0
          {
            echo "### CI results (code: $CODE, Windows inputs: $WINDOWS)"
            echo "| Lane | Result |"
            echo "| --- | --- |"
            for lane in "changes=$CHANGES" "static-fast=$STATIC_FAST" "typecheck=$TYPECHECK" "unit=$UNIT" "build=$BUILD" "windows-process=$WINDOWS_PROCESS"; do
              echo "| ${lane%%=*} | ${lane#*=} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # The docs-only filter itself must have run: without it a skip proves nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "changes=$CHANGES (filter must succeed)"
            fail=1
          fi
          if [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "code=$CODE (filter must return true or false)"
            fail=1
          fi
          # Fast static always runs, docs-only or not.
          if [ "$STATIC_FAST" != "success" ]; then
            echo "static-fast=$STATIC_FAST"
            fail=1
          fi
          for lane in "typecheck=$TYPECHECK" "unit=$UNIT" "build=$BUILD"; do
            name="${lane%%=*}"
            result="${lane#*=}"
            if [ "$CODE" != "true" ]; then
              # Docs-only run: heavy lanes must be skipped, never failed.
              if [ "$result" != "skipped" ]; then
                echo "$name=$result (docs-only run: expected skipped)"
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              echo "$name=$result"
              fail=1
            fi
          done
          if [ "$WINDOWS" != "true" ] && [ "$WINDOWS" != "false" ]; then
            echo "windows=$WINDOWS (filter must return true or false)"
            fail=1
          fi
          expected=skipped
          if [ "$CODE" = "true" ] && [ "$WINDOWS" = "true" ]; then expected=success; fi
          if [ "$WINDOWS_PROCESS" != "$expected" ]; then
            echo "windows-process=$WINDOWS_PROCESS (expected $expected)"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Open the red lane above, not this gate."
            exit 1
          fi

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: "full"

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      - name: Test Windows shared runtime
        run: >-
          bun run --cwd packages/shared test
          src/platform/windowsProcess.test.ts
          src/platform/platformProcess.test.ts
          src/platform/processRuntime.test.ts
          src/platform/platformEnvironment.test.ts

      - name: Test Windows server lifecycle
        run: >-
          bun run --cwd apps/server test
          src/platform/filesystemPlatform.test.ts
          src/platform/processTreeController.test.ts
          src/platform/effectProcessSignals.test.ts
          src/platform/supervisedProcessTeardown.test.ts
          src/provider/core/providerStartupLifecycle.test.ts
          src/platform/processRunner.test.ts
          src/platform/windowsProcessEffect.test.ts
          src/persistence/MigrationBackup.test.ts

      - name: Test Windows desktop shutdown
        run: >-
          bun run --cwd apps/desktop test
          src/backendShutdown.windows.integration.test.ts
