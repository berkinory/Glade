name: Cua native checks

on:
  pull_request:
    paths:
      - ".github/workflows/cua-native-check.yml"
      - ".github/actions/prepare-cua-source/**"
      - ".github/actions/setup-workspace/**"
      - ".github/actions/setup-node/**"
      - ".mise.toml"
      - "bun.lock"
      - "package.json"
      - "apps/desktop/package.json"
      - "apps/server/package.json"
      - "packages/shared/package.json"
      - "patches/**"
      - "apps/desktop/patches/cua-driver/**"
      - "apps/desktop/src/computer/cua/**"
      - "packages/shared/src/computer/cuaDriver*"
      - "packages/shared/src/computer/cuaActionDiagnostics*"
      - "apps/server/src/computer/**"
      - "apps/server/src/agentGateway/computerTools*"
      - "apps/server/src/orchestration/Layers/ProviderRuntimeIngestion*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cua-native-check.yml"
      - ".github/actions/prepare-cua-source/**"
      - ".github/actions/setup-workspace/**"
      - ".github/actions/setup-node/**"
      - ".mise.toml"
      - "bun.lock"
      - "package.json"
      - "apps/desktop/package.json"
      - "apps/server/package.json"
      - "packages/shared/package.json"
      - "patches/**"
      - "apps/desktop/patches/cua-driver/**"
      - "apps/desktop/src/computer/cua/**"
      - "packages/shared/src/computer/cuaDriver*"
      - "packages/shared/src/computer/cuaActionDiagnostics*"
      - "apps/server/src/computer/**"
      - "apps/server/src/agentGateway/computerTools*"
      - "apps/server/src/orchestration/Layers/ProviderRuntimeIngestion*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cua-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect native inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            native:
              - '.github/workflows/cua-native-check.yml'
              - '.github/actions/prepare-cua-source/**'
              - 'apps/desktop/patches/cua-driver/**'
              - 'packages/shared/src/computer/cuaDriverRelease.json'

  native:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true'
    name: macOS native compilation
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CUA_DRIVER_RS_TELEMETRY_ENABLED: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      CARGO_PROFILE_DEV_STRIP: none
      CARGO_PROFILE_TEST_STRIP: none
      # The pinned apple-metal Swift bridge needs the macOS 15 SDK.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare native check workspace
        uses: ./.github/actions/prepare-cua-source

      - name: Compile all macOS native tests
        run: cargo check --manifest-path "$CUA_NATIVE_SOURCE/libs/cua-driver/rust/Cargo.toml" --locked -p platform-macos --tests

      - name: Run focus restoration and compact cursor regressions
        run: |
          cargo test --manifest-path "$CUA_NATIVE_SOURCE/libs/cua-driver/rust/Cargo.toml" --locked -p platform-macos --lib focus_restore_policy
          cargo test --manifest-path "$CUA_NATIVE_SOURCE/libs/cua-driver/rust/Cargo.toml" --locked -p cursor-overlay --lib compact

  runtime:
    name: macOS host IPC and computer lifecycle
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
        with:
          scope: full
          save-dependencies: "true"

      - name: Run host IPC and diagnostic regressions
        run: |
          bun run --cwd apps/desktop test src/computer/cua
          bun run --cwd packages/shared test src/computer/cuaActionDiagnostics.test.ts

      - name: Run computer lifecycle and delivery regressions
        run: >-
          bun run --cwd apps/server test
          src/computer/ComputerManager.test.ts
          src/computer/ComputerManager.spaces.test.ts
          src/computer/CuaComputerBackend.test.ts
          src/computer/computerAuditLog.test.ts
          src/computer/computerLockResume.test.ts
          src/agentGateway/computerTools.test.ts
          src/agentGateway/computerTools.menusFrames.test.ts
          src/orchestration/Layers/ProviderRuntimeIngestion.test.ts
