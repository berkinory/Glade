name: Sync Homebrew cask

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Published Glade version, with or without the v prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Dispatch and verify Homebrew cask
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Actions write access to berkinory/homebrew-brew."
            exit 1
          fi
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          expected_digest="$(gh api "repos/berkinory/Glade/releases/tags/v${version}" \
            --jq ".assets[] | select(.name == \"Glade-${version}-universal.dmg\") | .digest")"
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh workflow run update-glade-cask.yml \
            --repo berkinory/homebrew-brew \
            -f version="$version"
          for attempt in {1..36}; do
            cask="$(gh api repos/berkinory/homebrew-brew/contents/Casks/glade.rb \
              --jq .content 2>/dev/null | base64 -d || true)"
            if grep -Fq "version \"$version\"" <<< "$cask" && \
               grep -Fq "sha256 \"${expected_digest#sha256:}\"" <<< "$cask"; then
              echo "Homebrew cask now matches Glade ${version}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Homebrew cask did not update to Glade ${version}."
          exit 1
