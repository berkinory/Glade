name: Recover Glade 0.2.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glade-release-refs/tags/v0.2.0
  cancel-in-progress: false

jobs:
  verify:
    name: Verify original release and CI
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.verify.outputs.source_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.2.0
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Verify preserved source and successful artifacts
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit=973feea4ceec67da8d9783ae9ea4593793249808
          node scripts/verify-release-source-provenance.ts 0.2.0 v0.2.0 true "$source_commit" tag v0.2.0
          gh api repos/berkinory/Glade/actions/runs/37447536901 > original-run.json
          jq -e --arg sha "$source_commit" '.head_sha == $sha and .path == ".github/workflows/release.yml" and .conclusion == "failure"' original-run.json
          gh api 'repos/berkinory/Glade/actions/runs/37447536901/jobs?per_page=100' > original-jobs.json
          for name in 'Build mac-arm64 / Build mac-arm64' 'Build linux-x64 / Build linux-x64'; do
            jq -e --arg name "$name" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' original-jobs.json
          done
          gh api "repos/berkinory/Glade/actions/workflows/ci.yml/runs?head_sha=$source_commit&branch=main&event=push" \
            --jq '.workflow_runs | sort_by(.created_at, .id) | last | .conclusion' | grep -Fx success
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
    permissions:
      contents: read
      actions: read

  build:
    name: Recover ${{ matrix.id }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-x64
            runner: macos-15-intel
            platform: mac
            target: dmg
          - id: win-x64
            runner: windows-2022
            platform: win
            target: nsis
    uses: ./.github/workflows/release-build.yml
    with:
      id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      arch: x64
      target: ${{ matrix.target }}
      release_tag: v0.2.0
      publish: true
    secrets: inherit
    permissions:
      contents: read
      actions: read

  publish:
    name: Assemble preserved and recovered platforms
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.2.0
      - uses: ./.github/actions/setup-node
      - name: Download preserved macOS arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Glade-mac-arm64
          run-id: 37447536901
          github-token: ${{ github.token }}
          path: release-raw
      - name: Download preserved Linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Glade-linux-x64
          run-id: 37447536901
          github-token: ${{ github.token }}
          path: release-raw
      - name: Download recovered platforms
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Glade-*
          merge-multiple: true
          path: release-raw
      - name: Verify and publish all four platforms
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
        run: |
          set -euo pipefail
          node scripts/assemble-release-assets.ts release-raw release-publish 0.2.0 "$SOURCE_COMMIT" true
          gh release create v0.2.0 release-publish/* --repo berkinory/Glade --verify-tag \
            --title 'Glade v0.2.0' --notes-file release-notes.md --latest

  sync-homebrew:
    name: Update Homebrew cask
    needs: publish
    uses: ./.github/workflows/sync-homebrew.yml
    with:
      version: v0.2.0
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
