name: Build release platform

on:
  workflow_call:
    inputs:
      id:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      target:
        required: true
        type: string
      release_tag:
        description: "Recover an existing release tag using the current qualification script"
        type: string
        default: ""
      publish:
        required: true
        type: boolean
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

env:
  PUBLISH_RELEASE: ${{ inputs.publish }}
  GLADE_DESKTOP_UPDATE_REPOSITORY: berkinory/Glade

jobs:
  build:
    name: Build ${{ inputs.id }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preserve recovery qualification script
        if: inputs.release_tag != ''
        shell: bash
        run: cp scripts/verify-windows-defender.ps1 "$RUNNER_TEMP/verify-windows-defender.ps1"
      - name: Checkout original release source
        if: inputs.release_tag != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Setup Node for provenance verification
        uses: ./.github/actions/setup-node
      - name: Verify exact source before building
        id: source
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          source_commit="$GITHUB_SHA"
          ref_type="$GITHUB_REF_TYPE"
          ref_name="$GITHUB_REF_NAME"
          if [[ -n "$RECOVERY_TAG" ]]; then
            source_commit=$(git rev-parse "$RECOVERY_TAG^{commit}")
            ref_type=tag
            ref_name="$RECOVERY_TAG"
          fi
          node scripts/verify-release-source-provenance.ts "$version" "v$version" "$PUBLISH_RELEASE" "$source_commit" "$ref_type" "$ref_name"
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"
      - uses: ./.github/actions/provision-cua
        if: inputs.platform != 'win'
        with:
          arch: ${{ inputs.arch }}
      - name: Build platform artifact
        shell: bash
        env:
          CSC_LINK: ${{ inputs.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ inputs.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ inputs.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          CSC_NAME: Pixen Interactive LLC (8M2GQK3TUP)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GLADE_MAC_ICON_CATALOG: ${{ github.workspace }}/assets/prod/Glade-Assets.car
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ steps.source.outputs.lockfile_sha256 }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          args=(--output-dir release --verbose --build-version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT" --lockfile-sha256 "$LOCKFILE_SHA256")
          if [[ -n "$SOURCE_TAG" ]]; then args+=(--source-tag "$SOURCE_TAG"); fi
          case "$BUILD_PLATFORM" in
            mac)
              if [[ "$PUBLISH_RELEASE" == "true" ]]; then
                key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                printf '%s' "$APPLE_API_KEY" > "$key_path"
                chmod 600 "$key_path"
                export APPLE_API_KEY="$key_path" CSC_IDENTITY_AUTO_DISCOVERY=true
                args+=(--signed)
              fi
              bun run "package:mac:$BUILD_ARCH" -- "${args[@]}"
              ;;
            linux) bun run package:linux -- "${args[@]}" ;;
            win) bun run package:win -- "${args[@]}" ;;
            *) exit 1 ;;
          esac
      - name: Verify packaged startup
        shell: bash
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_ARCH: ${{ inputs.arch }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: node scripts/verify-packaged-desktop-startup.ts --assets-dir release --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" --version "$RELEASE_VERSION" --executable-name glade
      - name: Collect and verify distribution assets
        shell: bash
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_ARCH: ${{ inputs.arch }}
          BUILD_TARGET: ${{ inputs.target }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ steps.source.outputs.lockfile_sha256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          case "$BUILD_PLATFORM" in
            mac)
              cp release/*.dmg release/*.zip release-publish/
              if [[ "$BUILD_ARCH" == x64 ]]; then
                cp release/latest-mac-x64.yml release-publish/latest-mac-x64.yml
              else
                cp release/latest-mac.yml release-publish/latest-mac-arm64.yml
              fi
              ;;
            linux) cp release/*.AppImage release/latest-linux.yml release-publish/ ;;
            win) cp release/*.exe release/latest.yml release-publish/ ;;
            *) exit 1 ;;
          esac
          find release -maxdepth 1 -name '*.blockmap' -exec cp {} release-publish/ \;
          signed=false
          if [[ "$BUILD_PLATFORM" == mac && "$PUBLISH_RELEASE" == true ]]; then signed=true; fi
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release-publish --platform "$BUILD_PLATFORM" --arch "$BUILD_ARCH" \
            --target "$BUILD_TARGET" --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" --publication "$PUBLISH_RELEASE" \
            --signed "$signed" --allow-unsigned-windows-publication true \
            --expected-mac-team-id "$APPLE_TEAM_ID"
      - name: Qualify final Windows installer with Microsoft Defender
        if: inputs.platform == 'win'
        shell: pwsh
        timeout-minutes: 15
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          $verifier = if ($env:RECOVERY_TAG) { Join-Path $env:RUNNER_TEMP 'verify-windows-defender.ps1' } else { './scripts/verify-windows-defender.ps1' }
          & $verifier -AssetsDirectory release-publish -EvidenceDirectory defender-evidence
      - name: Upload Defender qualification evidence
        if: always() && inputs.platform == 'win'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Defender-${{ inputs.id }}
          path: defender-evidence/
          if-no-files-found: error
      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glade-${{ inputs.id }}
          path: release-publish/
          if-no-files-found: error
          compression-level: 0
